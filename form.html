<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #a7b7d8;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            height: 100vh; 
        }

        .container {
            background-color: rgb(146, 178, 194);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 10 4px 20px rgba(0, 0, 0, 0.5);
            width: 450px;
            height: 100vh;
           
        }

        form label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-style: inherit;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 2px solid #e2acac;
            box-sizing: border-box;
            color: rgb(45, 23, 23);
        }

        input[type="radio"] {
            margin-right: 5px;
        }

        .radio-group {
            margin-bottom: 15px;
           
        }

        input[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #2b545d;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 80px;
            cursor: pointer;
            transition: background-color 0.9s ease;
        }

        input[type="submit"]:hover {
            background-color: #8a9d8b;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
 
    <div class="container">
    <form>
        <label for="name">Name:</label>
        <input type="name" placeholder="please enter your name" id="name"> <br> <br>

      <label for="email">Email</label>
        <input type="email" placeholder="enter the correct mail" id="email"><br> <br>


        <label for="password">password</label>
        <input type="password" placeholder="correct password" id="password"> <br><br>


<!-- Gender -->
 <label>Gender:</label> <br>
 <label><input type="radio" name="gender" value="male" required>male</label>
<label><input type="radio" name="gender" value="female" required>female</label>
<label><input type="radio" name="gender" value="other" required>other</label> <br><br>


<!-- COURSE -->
 <label for="course">Course:</label>
 <select name="course" id="course" required>
    <option value="">Select course</option>
    <option value="">Ethical hacking</option>
    <option value="">BCA</option>
    <option value="">BBA</option>
    <option value="">B.Tech</option>
 </select> <br><br>

 <!--Hobbies  -->
 <label for="Hobbies">Hobbies</label>
 <label> <input type="radio" name="Hobbies" value="Dancing">Dancing</label>
 <label><input type="radio" name="Hobbies" value="Singing">Singing</label>
 <label><input type="radio" name="Hobbies" value="Reading">Reading</label> <br><br>

          <input type="submit" value="submit">
     
       
    </form>
</div>
    
</body>
</html>
