<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>
<body>
 
    <div class="container">
    <form>
        <label for="name">Name:</label>
        <input type="name" placeholder="please enter your name" id="name"> <br> <br>

      <label for="email">Email</label>
        <input type="email" placeholder="enter the correct mail" id="email"><br> <br>


        <label for="password">password</label>
        <input type="password" placeholder="correct password" id="password"> <br><br>


<!-- Gender -->
 <label>Gender:</label> <br>
 <label><input type="radio" name="gender" value="male" required>male</label>
<label><input type="radio" name="gender" value="female" required>female</label>
<label><input type="radio" name="gender" value="other" required>other</label> <br><br>


<!-- COURSE -->
 <label for="course">Course:</label>
 <select name="course" id="course" required>
    <option value="">Select course</option>
    <option value="">Ethical hacking</option>
    <option value="">BCA</option>
    <option value="">BBA</option>
    <option value="">B.Tech</option>
 </select> <br><br>

 <!--Hobbies  -->
 <label for="Hobbies">Hobbies</label>
 <label> <input type="radio" name="Hobbies" value="Dancing">Dancing</label>
 <label><input type="radio" name="Hobbies" value="Singing">Singing</label>
 <label><input type="radio" name="Hobbies" value="Reading">Reading</label> <br><br>

          <input type="submit" value="submit">
     
       
    </form>
</div>
    
</body>
</html>
